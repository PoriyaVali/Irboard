name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
        # Fresh installs pull the latest dependencies, which require PHP >= 8.1.
        # 8.1 is the production runtime; 8.2 confirms forward compatibility.
      matrix:
        php: ['8.1', '8.2']

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: irboard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, gd, iconv, json, mysqli, pdo, pdo_mysql, redis, igbinary, opcache, pcntl, posix, tokenizer, xml, zip, openssl
          coverage: none
          tools: composer:v2

      - name: PHP syntax lint (all source files)
        run: |
          set -e
          echo "Linting PHP files..."
          find app config database routes library resources tests get_domain.php \
            -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null
          echo "✓ No syntax errors."

      - name: Deploy scripts are safe (syntax + no destructive git)
        run: |
          set -e
          bash -n init.sh
          bash -n update.sh
          echo "✓ init.sh / update.sh syntax OK"
          # Regression guard: the old updater ran `git reset --hard origin/master`,
          # which wipes a deployment that runs from a modified working tree.
          # Anchored to the start of a line so rollback hints printed inside
          # strings/comments don't trip it — only a real command counts.
          if grep -nE '^[[:space:]]*git[[:space:]]+reset[[:space:]]+--hard' update.sh init.sh; then
            echo "::error::A deploy script RUNS 'git reset --hard' — it would destroy local changes on live panels."
            exit 1
          fi
          # It must also never leave the web server stopped.
          if grep -nE '^[[:space:]]*(php|\./).*webman\.php[[:space:]]+stop' update.sh; then
            echo "::error::update.sh stops webman without restarting it."
            exit 1
          fi
          echo "✓ No destructive git reset, no stop-without-restart."
          # A fresh clone must be able to run them, so git has to carry the +x bit.
          for f in update.sh init.sh; do
            mode="$(git ls-files -s "$f" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error::$f is not executable in git (mode $mode). Fix: git update-index --chmod=+x $f"
              exit 1
            fi
          done
          echo "✓ Deploy scripts are executable in a fresh clone."
          # The updater must keep re-execing the newest copy of itself.
          grep -q 'IRBOARD_UPDATER_RESPAWNED' update.sh \
            || { echo "::error::update.sh lost its self-update guard."; exit 1; }
          echo "✓ update.sh self-updates before running."

      - name: cli-php.ini really enables OPcache + JIT (the webman runtime)
        run: |
          set -e
          # cli-php.ini exists purely for the long-running webman runtime. `php -c`
          # ignores the default php.ini, so if the opcache module is not loaded from
          # this file, every opcache.*/jit setting in it is dead config and the panel
          # runs fully interpreted.
          php -c cli-php.ini -r '
            $s = function_exists("opcache_get_status") ? @opcache_get_status(false) : null;
            if (!is_array($s)) {
              fwrite(STDERR, "OPcache is NOT loaded via cli-php.ini — its opcache/jit settings do nothing.\n");
              exit(1);
            }
            printf("opcache on | jit=%s | validate_timestamps=%s\n",
                   ini_get("opcache.jit"), ini_get("opcache.validate_timestamps"));
            if (ini_get("opcache.validate_timestamps") !== "1") {
              fwrite(STDERR, "validate_timestamps must be 1: webman workers would serve stale code after an update.\n");
              exit(1);
            }
          '
          echo "✓ cli-php.ini loads OPcache with settings that are safe for a long-running runtime."

      - name: Tests cannot reach a real database
        run: |
          set -e
          # RefreshDatabase runs `migrate:fresh`, which DROPS EVERY TABLE. This panel's
          # schema comes from install.sql rather than migrations, so nothing would put
          # it back. If phpunit.xml does not pin the connection, phpunit falls through
          # to .env — and `vendor/bin/phpunit` in a panel directory then destroys the
          # live database. phpunit ships in the vendor dir of every install, so this is
          # one command away for anyone.
          conn=$(php -r '$x=simplexml_load_file("phpunit.xml"); foreach($x->php->server as $s){ if((string)$s["name"]==="DB_CONNECTION") echo (string)$s["value"]; }')
          db=$(php -r   '$x=simplexml_load_file("phpunit.xml"); foreach($x->php->server as $s){ if((string)$s["name"]==="DB_DATABASE")   echo (string)$s["value"]; }')
          echo "phpunit.xml pins DB_CONNECTION=[${conn}] DB_DATABASE=[${db}]"
          if [ "$conn" != "sqlite" ] || [ "$db" != ":memory:" ]; then
            echo "::error::phpunit.xml must pin DB_CONNECTION=sqlite and DB_DATABASE=:memory:. Without it phpunit uses the .env database and RefreshDatabase drops every table in it."
            exit 1
          fi
          echo "✓ tests are sandboxed to in-memory SQLite and cannot touch a panel."

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-all

      - name: Install dependencies
        # `install`, not `update`: this is what init.sh and update.sh run, so CI
        # resolves exactly the versions a real panel gets. It also fails outright if
        # composer.lock has drifted from composer.json.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependency security advisories
        continue-on-error: true
        run: |
          # "advisories were reported" is useless on its own — name them, so they can
          # actually be judged. Now that composer.lock is committed, any vulnerable
          # version is pinned and ships to every new install.
          composer audit --no-interaction --format=json > /tmp/audit.json 2>/dev/null || true
          php -r '
            $j = @json_decode(@file_get_contents("/tmp/audit.json"), true);
            $adv = is_array($j) ? ($j["advisories"] ?? []) : [];
            if (!$adv) { echo "✓ no known advisories against the locked versions\n"; exit(0); }
            $n = 0;
            foreach ($adv as $pkg => $list) {
              foreach ($list as $a) {
                $n++;
                $msg = sprintf("%s (installed affected: %s) %s — %s",
                  $pkg,
                  $a["affectedVersions"] ?? "?",
                  $a["cve"] ?? ($a["advisoryId"] ?? ""),
                  $a["title"] ?? "");
                fwrite(STDERR, "::warning::advisory: " . preg_replace("/\s+/", " ", $msg) . "\n");
              }
            }
            fwrite(STDERR, "\n{$n} advisories — see the annotations.\n");
          '

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's#^APP_DEBUG=.*#APP_DEBUG=true#' .env
          sed -i 's#^DB_HOST=.*#DB_HOST=127.0.0.1#' .env
          sed -i 's#^DB_PORT=.*#DB_PORT=3306#' .env
          sed -i 's#^DB_DATABASE=.*#DB_DATABASE=irboard_test#' .env
          sed -i 's#^DB_USERNAME=.*#DB_USERNAME=root#' .env
          sed -i 's#^DB_PASSWORD=.*#DB_PASSWORD=root#' .env
          sed -i 's#^REDIS_HOST=.*#REDIS_HOST=127.0.0.1#' .env
          sed -i 's#^CACHE_DRIVER=.*#CACHE_DRIVER=redis#' .env
          # v2board settings live in config/v2board.php (gitignored); a fresh
          # checkout has none, so seed an empty one so the app can boot.
          [ -f config/v2board.php ] || echo "<?php return [];" > config/v2board.php
          php artisan key:generate

      - name: Import database schema (install.sql)
        run: |
          set -e
          mysql -h127.0.0.1 -uroot -proot irboard_test < database/install.sql
          TABLES=$(mysql -h127.0.0.1 -uroot -proot irboard_test -N -e "SHOW TABLES;" | wc -l)
          echo "✓ Imported schema — $TABLES tables."
          test "$TABLES" -gt 0
          mysql -h127.0.0.1 -uroot -proot irboard_test -e "SELECT COUNT(*) AS v2_user_ok FROM v2_user;" >/dev/null
          echo "✓ Core table v2_user is queryable."

      - name: Boot Laravel (artisan)
        run: |
          set -e
          php artisan --version
          php artisan config:clear
          php artisan route:list --json >/dev/null
          echo "✓ Application boots and routes register."

      - name: Every route resolves to a real controller method (signature check)
        run: |
          set -e
          # A route pointing at a method that does not exist looks completely fine
          # until someone hits that URL, and then it is a 500 ("Method ...::x() does
          # not exist"). Same for a URI that cannot supply the arguments the method
          # requires. Neither is caught by lint, by booting, or by the smoke test,
          # because nothing calls those URLs — so check every route up front.
          #
          # A handful of these are inherited from upstream v2board, which declares the
          # same routes without ever having shipped the methods. They are listed as
          # known below and reported as warnings rather than failures: the job of this
          # gate is to stop *new* broken routes from landing, not to force a rewrite of
          # code we did not break. Implement one, then drop it from the list.
          cat > /tmp/route-integrity.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          // Keyed by Class::method, not by URI: the admin prefix is a per-install hash
          // of APP_KEY, so it differs on every run.
          $KNOWN_MISSING = [
              'App\Http\Controllers\V1\User\KnowledgeController::getCategory',
              'App\Http\Controllers\V1\Admin\NoticeController::update',
              'App\Http\Controllers\V1\Admin\StatController::getStat',
              'App\Http\Controllers\V1\Admin\StatController::getRanking',
              'App\Http\Controllers\V1\Admin\StatController::getStatRecord',
              'App\Http\Controllers\V1\Admin\UserController::setInviteUser',
              'App\Http\Controllers\V1\Guest\PaymentController::aghayehpardakhtCallback',
              'App\Http\Controllers\V1\Guest\PaymentController::zibalCallback',
          ];
          // Signature mismatches, keyed by URI (these live in routes/web.php, which has
          // no per-install prefix). payment/notify/zibal/{uuid} is unreachable in any
          // case: payment/notify/{method}/{uuid} is registered first and matches first.
          $KNOWN_SIGNATURE = [
              'payment/notify/zibal/{uuid}',
          ];

          $bad = [];
          $warn = [];
          foreach (app('router')->getRoutes() as $route) {
              $uses = $route->getAction()['uses'] ?? null;
              if (!is_string($uses) || strpos($uses, '@') === false) {
                  continue; // closure route — nothing to resolve
              }
              [$class, $method] = explode('@', $uses, 2);
              $where = strtoupper(implode('|', $route->methods())) . ' /' . $route->uri();

              if (!class_exists($class)) {
                  $bad[] = "missing class {$class}  <-  {$where}";
                  continue;
              }
              if (!method_exists($class, $method)) {
                  $line = "missing method {$class}::{$method}()  <-  {$where}";
                  if (in_array("{$class}::{$method}", $KNOWN_MISSING, true)) { $warn[] = $line; } else { $bad[] = $line; }
                  continue;
              }
              // Anything the container cannot inject and that has no default must be
              // named in the URI, or the call dies with ArgumentCountError.
              $given = $route->parameterNames();
              foreach ((new ReflectionMethod($class, $method))->getParameters() as $p) {
                  $type = $p->getType();
                  if ($type && !$type->isBuiltin()) continue;              // injected
                  if ($p->isDefaultValueAvailable() || $p->isVariadic()) continue; // optional
                  if (!in_array($p->getName(), $given, true)) {
                      $line = sprintf(
                          'URI supplies {%s} but %s::%s() requires $%s  <-  %s',
                          implode('},{', $given) ?: '', $class, $method, $p->getName(), $where
                      );
                      if (in_array($route->uri(), $KNOWN_SIGNATURE, true)) { $warn[] = $line; } else { $bad[] = $line; }
                  }
              }
          }

          foreach ($warn as $w) {
              fwrite(STDERR, "::warning::route integrity (known, inherited from upstream v2board): {$w}\n");
          }
          if ($bad) {
              foreach ($bad as $b) {
                  fwrite(STDERR, "::error::route integrity: {$b}\n");
              }
              fwrite(STDERR, "\n" . count($bad) . " NEW broken route(s) — these are 500s waiting to happen.\n");
              exit(1);
          }
          echo "✓ no new broken routes (" . count($warn) . " known, pre-existing)\n";
          $n = count(app('router')->getRoutes());
          echo "✓ all {$n} routes resolve to a real method whose signature the URI can satisfy\n";
          PHP
          php /tmp/route-integrity.php

      - name: Scheduled tasks point at commands that exist
        run: |
          set -e
          # A schedule entry naming a command that isn't registered fails silently
          # every single minute in production — cron swallows it and nobody notices
          # until traffic stops being counted or orders stop being checked.
          cat > /tmp/schedule-integrity.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();

          $registered = array_keys($kernel->all());
          $schedule = $app->make(Illuminate\Console\Scheduling\Schedule::class);
          $bad = [];
          $seen = 0;
          foreach ($schedule->events() as $event) {
              if (!preg_match('/artisan["\']?\s+["\']?([a-zA-Z0-9:_-]+)/', (string) $event->command, $m)) {
                  continue; // shell callback, not an artisan command
              }
              $seen++;
              if (!in_array($m[1], $registered, true)) {
                  $bad[] = $m[1];
              }
          }
          foreach ($bad as $name) {
              fwrite(STDERR, "::error::scheduler: '{$name}' is scheduled but is not a registered artisan command\n");
          }
          if ($bad) { exit(1); }
          echo "✓ all {$seen} scheduled artisan commands are registered\n";
          PHP
          php /tmp/schedule-integrity.php

      - name: Queue workers start in every environment a panel is run in
        id: audit_queue_envs
        # Run every audit before failing, so one finding never hides the rest.
        continue-on-error: true
        run: |
          set -e
          # Horizon only starts workers for environments named in horizon.environments:
          # ProvisioningPlan::deploy($env) returns early when the key is absent, so an
          # unlisted APP_ENV means ZERO workers and not one line of output about it —
          # orders, mail, traffic and telegram all just stop.
          #
          # .env.example ships APP_ENV=local and v2board:install never rewrites it, so
          # every panel runs as "local". Setting APP_ENV=production — the obvious thing
          # to do on a live server — must not silently disable the queue.
          cat > /tmp/horizon-envs.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $envs = config('horizon.environments', []);
          echo "horizon.environments defines: " . (implode(', ', array_keys($envs)) ?: '(nothing)') . "\n";
          $bad = [];
          foreach (['local', 'production'] as $e) {
              if (empty($envs[$e])) {
                  $bad[] = $e;
                  fwrite(STDERR, "::error::horizon: APP_ENV={$e} has no supervisor config — every queue worker would silently fail to start\n");
              }
          }
          if ($bad) { exit(1); }
          echo "✓ queue workers are provisioned for both local and production\n";
          PHP
          php /tmp/horizon-envs.php

      - name: The Horizon dashboard is not left open to the public
        id: audit_horizon_auth
        # Run every audit before failing, so one finding never hides the rest.
        continue-on-error: true
        run: |
          set -e
          # Horizon's own auth is `app()->environment('local') || Gate::check(...)`, and
          # the gate here lists no emails. Since every panel runs as APP_ENV=local, that
          # check passes for ANYONE — the route middleware is the only thing standing
          # between the internet and the queue dashboard (job payloads, retry, delete).
          cat > /tmp/horizon-auth.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $mw = (array) config('horizon.middleware', ['web']);
          echo "horizon.path=" . config('horizon.path') . "  horizon.middleware=[" . implode(',', $mw) . "]\n";
          $auth = array_intersect($mw, ['admin', 'staff', 'auth', 'user']);
          if (!$auth) {
              fwrite(STDERR, "::error::horizon: dashboard middleware [" . implode(',', $mw) . "] contains no authentication — with APP_ENV=local Horizon authorises everyone, so /" . config('horizon.path') . " would be world-readable\n");
              exit(1);
          }
          echo "✓ dashboard is gated by [" . implode(',', $auth) . "] on top of Horizon's own (open-in-local) check\n";
          PHP
          php /tmp/horizon-auth.php

      - name: Every model maps to a table and columns the schema really has
        id: audit_model_schema
        # Run every audit before failing, so one finding never hides the rest.
        continue-on-error: true
        run: |
          set -e
          # The schema is applied from install.sql, not migrations, so nothing keeps it
          # in step with the models. A model pointing at a table (or declaring a column)
          # that install.sql never creates is a runtime SQL error the moment that code
          # path is first taken.
          cat > /tmp/model-schema.php <<'PHP'
          <?php
          $base = getcwd();
          require $base . '/vendor/autoload.php';
          $app = require $base . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          // Fossils: models left behind when upstream v2board retired their tables.
          // v2_server_stat was literally dropped in upstream's update.sql and replaced
          // by v2_stat_server; v2_server_log belongs to the same retired generation.
          // Their live successors are Stat/StatServer/StatUser on v2_stat*, which this
          // check does verify. Nothing calls ServerService::log() and nothing
          // references ServerStat at all, so no code path can reach the missing tables
          // — and re-creating tables upstream deliberately dropped would be worse than
          // leaving these here. Reported as warnings; new drift still fails.
          $KNOWN_FOSSIL = [
              'App\Models\ServerLog',
              'App\Models\ServerStat',
          ];

          $bad = [];
          $warn = [];
          $checked = 0;
          foreach (glob($base . '/app/Models/*.php') as $file) {
              $class = 'App\Models\\' . basename($file, '.php');
              if (!class_exists($class)) { continue; }
              $rc = new ReflectionClass($class);
              if ($rc->isAbstract() || !$rc->isSubclassOf(Illuminate\Database\Eloquent\Model::class)) { continue; }

              $model = new $class;
              $table = $model->getTable();
              $checked++;

              if (!Illuminate\Support\Facades\Schema::hasTable($table)) {
                  $line = "{$rc->getShortName()} maps to table `{$table}`, which the schema never creates";
                  if (in_array($class, $KNOWN_FOSSIL, true)) { $warn[] = $line . ' (retired upstream; unreachable)'; }
                  else { $bad[] = $line; }
                  continue;
              }
              $declared = array_unique(array_merge($model->getFillable(), array_keys($model->getCasts())));
              foreach ($declared as $col) {
                  if (!Illuminate\Support\Facades\Schema::hasColumn($table, $col)) {
                      $bad[] = "{$rc->getShortName()}: `{$table}`.`{$col}` is declared on the model but missing from the schema";
                  }
              }
          }
          foreach ($warn as $w) {
              fwrite(STDERR, "::warning::model/schema (known fossil): {$w}\n");
          }
          foreach ($bad as $b) {
              fwrite(STDERR, "::error::model/schema drift: {$b}\n");
          }
          if ($bad) {
              fwrite(STDERR, "\n" . count($bad) . " NEW drift(s) across {$checked} models\n");
              exit(1);
          }
          echo "✓ all {$checked} models map onto tables and columns that exist (" . count($warn) . " known fossil(s))\n";
          PHP
          php /tmp/model-schema.php

      - name: cli-php.ini is safe for a public runtime
        id: audit_php_ini
        # Run every audit before failing, so one finding never hides the rest.
        continue-on-error: true
        run: |
          set -e
          # This ini is what serves production through webman. APP_DEBUG=false keeps
          # Laravel quiet, but startup and fatal errors are raised before/outside
          # Laravel's handler and go straight into the HTTP response with real paths.
          php -c cli-php.ini -r '
            $bad = [];
            foreach (["display_errors", "display_startup_errors", "expose_php"] as $k) {
              $v = (string) ini_get($k);
              if ($v !== "" && $v !== "0" && strtolower($v) !== "off") { $bad[] = "{$k}={$v}"; }
            }
            if (!ini_get("log_errors")) { $bad[] = "log_errors is off (errors would go nowhere)"; }
            if ($bad) {
              fwrite(STDERR, "::error::cli-php.ini leaks internals to clients: " . implode(", ", $bad) . " — a fatal or startup error prints file paths into the HTTP response\n");
              exit(1);
            }
            echo "✓ cli-php.ini keeps errors out of responses and in the log\n";
          '

      - name: Dependencies are pinned (informational)
        continue-on-error: true
        run: |
          if git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo "✓ composer.lock is committed — every install resolves to identical code"
          else
            echo "::warning::composer.lock is gitignored, so each install resolves its own dependency versions. Two servers set up a week apart do not run the same code, and an upstream release can break a fresh install with no change on our side."
          fi

      - name: End-to-end API smoke (register → login → authenticated fetch)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 >serve.log 2>&1 &
          for i in $(seq 1 25); do
            curl -s -o /dev/null http://127.0.0.1:8000/api/v1/guest/comm/config && break
            sleep 1
          done
          # On any failure, surface the reason as a single-line annotation (readable
          # without log access — annotations truncate at the first newline).
          fail() { echo "::error::E2E: $(printf '%s' "$1" | tr '\n\r\t' '   ' | head -c 500)"; echo "--- serve.log (tail) ---"; tail -25 serve.log; exit 1; }

          B=$(curl -s -w '\n%{http_code}' http://127.0.0.1:8000/api/v1/guest/comm/config)
          echo "config -> $B"
          [ "$(echo "$B" | tail -1)" = "200" ] || fail "comm/config not 200 :: $(echo "$B" | tr '\n' ' ' | head -c 250)"

          REG=$(curl -s -w '|%{http_code}' -X POST http://127.0.0.1:8000/api/v1/passport/auth/register -d 'email=ci@example.com&password=password123')
          echo "register -> $REG"

          LOGIN=$(curl -s -X POST http://127.0.0.1:8000/api/v1/passport/auth/login -d 'email=ci@example.com&password=password123')
          echo "login -> $LOGIN"
          AUTH=$(printf '%s' "$LOGIN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('auth_data',''))" 2>/dev/null || true)
          [ -n "$AUTH" ] || fail "no auth_data. register=[$(printf '%s' "$REG" | head -c 200)] login=[$(printf '%s' "$LOGIN" | head -c 200)]"
          echo "  ✓ login returned auth_data"

          INFO=$(curl -s http://127.0.0.1:8000/api/v1/user/info -H "Authorization: $AUTH")
          echo "user/info -> $(printf '%s' "$INFO" | tr '\n' ' ')"
          EMAIL=$(printf '%s' "$INFO" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('email',''))" 2>/dev/null || true)
          [ "$EMAIL" = "ci@example.com" ] || fail "user/info did not return our user :: $INFO"
          echo "✓ Full request → auth → DB → response cycle works (user: $EMAIL)."

      - name: End-to-end on the webman runtime (what production actually serves)
        run: |
          # The step above proves the app works under `artisan serve` — a fresh
          # bootstrap per request. Production serves it through webman + AdapterMan:
          # long-lived workers that boot once and then handle every request from the
          # same process. Bugs that only bite there (leaked static/global state,
          # AdapterMan's header/session shims, a worker that dies on boot) are
          # invisible to `artisan serve`, so exercise the real runtime too.
          wfail() {
            echo "::error::webman E2E: $(printf '%s' "$1" | tr '\n\r\t' '   ' | head -c 500)"
            echo "--- webman start output ---"; tail -30 webman-start.log 2>/dev/null || true
            echo "--- workerman.log ---";       tail -30 workerman.log 2>/dev/null || true
            php -c cli-php.ini webman.php stop >/dev/null 2>&1 || true
            exit 1
          }

          php -c cli-php.ini webman.php start -d >webman-start.log 2>&1 || wfail "webman failed to start"
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:6600/api/v1/guest/comm/config && break
            sleep 1
          done

          B=$(curl -s -w '|%{http_code}' http://127.0.0.1:6600/api/v1/guest/comm/config)
          echo "webman config -> $(printf '%s' "$B" | head -c 200)"
          case "$B" in *'|200') ;; *) wfail "comm/config on webman :: $(printf '%s' "$B" | head -c 300)";; esac

          REG=$(curl -s -w '|%{http_code}' -X POST http://127.0.0.1:6600/api/v1/passport/auth/register -d 'email=ci-webman@example.com&password=password123')
          echo "webman register -> $(printf '%s' "$REG" | head -c 200)"

          LOGIN=$(curl -s -X POST http://127.0.0.1:6600/api/v1/passport/auth/login -d 'email=ci-webman@example.com&password=password123')
          AUTH=$(printf '%s' "$LOGIN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('auth_data',''))" 2>/dev/null || true)
          [ -n "$AUTH" ] || wfail "webman login gave no auth_data. register=[$(printf '%s' "$REG" | head -c 200)] login=[$(printf '%s' "$LOGIN" | head -c 200)]"

          INFO=$(curl -s http://127.0.0.1:6600/api/v1/user/info -H "Authorization: $AUTH")
          EMAIL=$(printf '%s' "$INFO" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('email',''))" 2>/dev/null || true)
          [ "$EMAIL" = "ci-webman@example.com" ] || wfail "webman user/info did not return our user :: $(printf '%s' "$INFO" | head -c 300)"
          echo "  ✓ auth flow works on webman (user: $EMAIL)"

          # A long-lived worker has to stay correct on request 50 the same way it was
          # on request 1. Fire enough of them to land on every worker in the pool.
          OK=0
          for i in $(seq 1 8); do
            R=$(curl -s -H "Authorization: $AUTH" http://127.0.0.1:6600/api/v1/user/info)
            case "$R" in
              *'ci-webman@example.com'*) OK=$((OK + 1)) ;;
              *) echo "  request $i returned: $(printf '%s' "$R" | tr '\n' ' ' | head -c 200)" ;;
            esac
          done
          [ "$OK" = "8" ] || wfail "warm workers degraded: only $OK/8 returned the right user (state leaking between requests?)"
          echo "  ✓ repeated requests across the worker pool stay correct (8/8)"

          # An authenticated identity must not survive into the next request on the
          # same worker: without an Authorization header this has to come back 401/403.
          ANON=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6600/api/v1/user/info)
          case "$ANON" in 401|403) echo "  ✓ auth state does not leak between requests (anonymous -> $ANON)";;
                          *) wfail "SECURITY: unauthenticated /user/info returned $ANON on a warm worker — auth state leaks across requests";; esac

          php -c cli-php.ini webman.php stop >/dev/null 2>&1 || true
          echo "✓ The production runtime (webman + AdapterMan) serves the app correctly."

      - name: Audit result
        if: always()
        run: |
          # The audits above each run to completion so a single finding cannot mask
          # the others; this is where they are added up and the build goes red.
          fail=0
          check() {
            if [ "$2" = "failure" ]; then echo "  ✗ $1"; fail=1; else echo "  ✓ $1"; fi
          }
          echo "Audit findings:"
          check "queue workers provisioned for every APP_ENV" "${{ steps.audit_queue_envs.outcome }}"
          check "Horizon dashboard is authenticated"          "${{ steps.audit_horizon_auth.outcome }}"
          check "models match the schema"                     "${{ steps.audit_model_schema.outcome }}"
          check "cli-php.ini safe for a public runtime"       "${{ steps.audit_php_ini.outcome }}"
          echo
          if [ "$fail" = "1" ]; then
            echo "::error::One or more audits failed — see the annotations above for the specific defect."
            exit 1
          fi
          echo "All audits pass."

      - name: Run tests (informational)
        continue-on-error: true
        run: |
          if [ ! -f phpunit.xml ] || [ ! -x vendor/bin/phpunit ]; then
            echo "No phpunit setup found — skipping."
            exit 0
          fi
          # Report WHICH tests fail instead of just that some do — "reported failures"
          # told us nothing and hid this for the whole life of the workflow.
          vendor/bin/phpunit --no-coverage > /tmp/phpunit.log 2>&1 || true
          tail -60 /tmp/phpunit.log
          grep -E '^(Tests:|OK|OK \()' /tmp/phpunit.log | while read -r l; do
            echo "::warning::phpunit summary: ${l}"
          done
          # Each failure block starts with "1) Tests\Feature\FooTest::bar".
          grep -A2 -E '^[0-9]+\) ' /tmp/phpunit.log | head -60 | tr '\n' '\v' \
            | sed 's/\v\v/\n/g' | head -20 | while read -r blk; do
              [ -n "$blk" ] && echo "::warning::phpunit failure: $(printf '%s' "$blk" | tr '\v' ' ' | head -c 220)"
            done

  installer:
    name: Installer (php artisan v2board:install)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: irboard_install
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, gd, iconv, json, mysqli, pdo, pdo_mysql, redis, igbinary, opcache, pcntl, posix, tokenizer, xml, zip, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        # `install`, not `update`: this is what init.sh and update.sh run, so CI
        # resolves exactly the versions a real panel gets. It also fails outright if
        # composer.lock has drifted from composer.json.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run the real installer (the path ./init.sh takes)
        run: |
          # v2board:install refuses to run when .env exists; a clean checkout has none.
          test ! -f .env || { echo "::error::.env should not be committed"; exit 1; }
          # Prompts, in order: db host, db name, db user, db password, admin email.
          set +e
          OUT="$(printf '127.0.0.1\nirboard_install\nroot\nroot\nci-admin@example.com\n' \
                 | php artisan v2board:install 2>&1)"
          RC=$?
          set -e
          echo "----- installer output -----"
          echo "$OUT"
          echo "----------------------------"
          if [ "$RC" -ne 0 ]; then
            echo "::error::installer exited $RC :: $(printf '%s' "$OUT" | tr '\n\r\t' '   ' | head -c 500)"
            exit 1
          fi

      - name: Verify what the installer produced
        run: |
          set -e
          MYSQL="mysql -h127.0.0.1 -uroot -proot"
          # The installer catches its own exceptions and still exits 0, so the
          # result is what we must assert — never the exit code.
          [ -f .env ] || { echo "::error::installer did not create .env"; exit 1; }
          grep -q '^APP_KEY=base64:' .env || { echo "::error::installer did not set APP_KEY"; exit 1; }
          T=$($MYSQL irboard_install -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard_install';")
          echo "tables created by the installer: $T"
          # Also proves install.sql survives the installer's strip-newline/split-on-';'
          # parsing — a stray comment or a ';' inside a string would drop statements.
          [ "$T" -ge 47 ] || { echo "::error::installer only created $T tables (expected >= 47)"; exit 1; }
          A=$($MYSQL irboard_install -N -e "SELECT COUNT(*) FROM v2_user WHERE is_admin=1;")
          [ "$A" -eq 1 ] || { echo "::error::installer did not create exactly one admin (got $A)"; exit 1; }
          echo "✓ v2board:install produced a complete schema ($T tables) and an admin account."

      - name: Admin panel opens after the installer (config/v2board.php + HTTP 200)
        run: |
          set -e
          # The reported bug: a fresh `git clone && sh init.sh` left NO
          # config/v2board.php, and the admin panel would not open. v2board keeps
          # its settings there; without it the admin page and the admin API fall
          # back to different default paths. Assert the file exists AND the printed
          # admin path is actually served (200) — not 404/500.
          [ -f config/v2board.php ] || { echo "::error::installer did not create config/v2board.php"; exit 1; }
          SP="$(php -r 'require "vendor/autoload.php"; $a=require "bootstrap/app.php"; $a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo (string) config("v2board.secure_path");')"
          [ -n "$SP" ] || { echo "::error::config/v2board.php has no secure_path — the admin path is undefined"; exit 1; }
          echo "admin secure_path = $SP"
          php artisan serve --host=127.0.0.1 --port=8000 >/tmp/serve.log 2>&1 &
          SV=$!
          for i in $(seq 1 20); do curl -s -o /dev/null --max-time 2 "http://127.0.0.1:8000/" && break; sleep 1; done
          admin=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/${SP}")
          api=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/v1/${SP}/config/fetch")
          kill "$SV" 2>/dev/null || true
          echo "GET /${SP} -> ${admin} | GET /api/v1/${SP}/config/fetch -> ${api}"
          [ "$admin" = "200" ] || { echo "::error::admin panel path returned ${admin} (expected 200)"; sed -n '1,40p' /tmp/serve.log; exit 1; }
          case "$api" in
            404) echo "::error::admin API at the panel's secure_path is 404 — the page and the API disagree on the path"; exit 1;;
            *)   echo "✓ admin API resolves at the same secure_path (HTTP ${api}, auth-gated)";;
          esac
          echo "✓ config/v2board.php created and the admin panel opens (HTTP ${admin})."

      - name: Installer refuses to re-run over an existing .env
        run: |
          set -e
          OUT="$(php artisan v2board:install 2>&1 || true)"
          if $(echo "$OUT" | grep -q '.env'); then
            echo "✓ Re-running the installer is refused while .env exists (expected)."
          else
            echo "::warning::Installer did not clearly refuse a re-run."
          fi

      - name: aaPanel auto-detect — installer reads the DB from the panel, asks only for the email
        run: |
          set -e
          # On aaPanel the installer should pull the DB name/user/password
          # automatically (aaPanel stores them, plaintext, in its panel SQLite)
          # and only ask for the admin email. Build a minimal panel SQLite that
          # points at the CI database, then run a FRESH install feeding ONLY the
          # email — no database prompts must be needed.
          rm -f .env config/v2board.php
          sudo mkdir -p /www/server/panel/data
          sudo chmod -R 777 /www/server
          php -r '
            $p = getcwd();
            $db = new PDO("sqlite:/www/server/panel/data/default.db");
            $db->exec("CREATE TABLE sites (id INTEGER PRIMARY KEY, name TEXT, path TEXT)");
            $db->exec("CREATE TABLE databases (id INTEGER PRIMARY KEY, pid INTEGER, name TEXT, username TEXT, password TEXT, ps TEXT)");
            $db->prepare("INSERT INTO sites (id,name,path) VALUES (1,?,?)")->execute(["irboard.test", $p]);
            $db->prepare("INSERT INTO databases (id,pid,name,username,password,ps) VALUES (1,1,?,?,?,?)")->execute(["irboard_install","root","root","irboard.test"]);
            echo "mock aaPanel panel DB ready\n";
          '
          OUT="$(printf 'ci-admin@example.com\n' | php artisan v2board:install 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -qi 'aaPanel detected' || { echo "::error::installer did not auto-detect aaPanel"; exit 1; }
          grep -q '^DB_DATABASE=irboard_install' .env || { echo "::error::DB name not auto-filled from the panel"; sed -n '1,30p' .env; exit 1; }
          grep -q '^DB_USERNAME=root' .env       || { echo "::error::DB user not auto-filled from the panel"; exit 1; }
          [ -f config/v2board.php ]               || { echo "::error::config/v2board.php not created"; exit 1; }
          T=$(mysql -h127.0.0.1 -uroot -proot irboard_install -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard_install';")
          [ "$T" -ge 47 ] || { echo "::error::schema not imported via the aaPanel path ($T tables)"; exit 1; }
          echo "✓ aaPanel path: DB creds pulled from the panel SQLite; only the admin email was asked."
          sudo rm -rf /www/server/panel

  database:
    name: Database schema (install.sql)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: irboard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MYSQL: mysql -h127.0.0.1 -uroot -proot
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Import install.sql into a fresh database
        run: |
          set -e
          $MYSQL irboard < database/install.sql
          echo "✓ install.sql imported with no errors."

      - name: All expected tables exist (core + custom features)
        run: |
          set -e
          EXPECTED="failed_jobs migrations payment_tracks settings sms_logs \
            v2_bot_channels v2_bot_panels v2_bot_settings v2_bot_texts \
            v2_card_payment_config v2_card_payments v2_commission_log v2_coupon \
            v2_giftcard v2_invite_code v2_knowledge v2_log v2_mail_log v2_notice \
            v2_order v2_payment v2_plan v2_plan_prices v2_reseller_log v2_reserved_plans \
            v2_server_anytls v2_server_group v2_server_hysteria v2_server_mdns \
            v2_server_route v2_server_shadowsocks v2_server_trojan v2_server_tuic \
            v2_server_v2node v2_server_v2ray v2_server_vless v2_server_vmess v2_sms_log \
            v2_stat v2_stat_server v2_stat_user v2_ticket v2_ticket_message v2_tunnel_map \
            v2_tutorial v2_user v2_user_banned_backup"
          for t in $EXPECTED; do
            $MYSQL irboard -N -e "SELECT 1 FROM \`$t\` LIMIT 0" >/dev/null \
              || { echo "::error::missing or broken table: $t"; exit 1; }
          done
          CNT=$($MYSQL irboard -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard';")
          echo "✓ $CNT tables present; all core + custom-feature tables verified."
          test "$CNT" -ge 47

      - name: Key columns present (schema correctness)
        run: |
          set -e
          col() { $MYSQL irboard -N -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='irboard' AND table_name='$1' AND column_name='$2';" | grep -qx 1 || { echo "::error::$1.$2 missing"; exit 1; }; }
          for c in email password token uuid transfer_enable u d expired_at banned group_id plan_id; do col v2_user "$c"; done
          for c in name group_id transfer_enable month_price device_limit show; do col v2_plan "$c"; done
          for c in user_id plan_id type period trade_no total_amount status; do col v2_order "$c"; done
          col v2_ticket subject
          col v2_server_anytls host
          echo "✓ All key columns present on core tables."

      - name: Storage engine check
        run: |
          set -e
          BAD=$($MYSQL irboard -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard' AND engine<>'InnoDB';")
          test "$BAD" -eq 0
          echo "✓ Every table uses the InnoDB engine."

      - name: Functional smoke — insert & read
        run: |
          set -e
          $MYSQL irboard -e "INSERT INTO v2_plan (group_id, transfer_enable, name, created_at, updated_at) VALUES (1, 100, 'CI Plan', UNIX_TIMESTAMP(), UNIX_TIMESTAMP()); INSERT INTO v2_user (email, password, uuid, token, created_at, updated_at) VALUES ('ci@example.com', 'hash', UUID(), REPLACE(UUID(),'-',''), UNIX_TIMESTAMP(), UNIX_TIMESTAMP()); INSERT INTO v2_order (user_id, plan_id, type, period, trade_no, total_amount, created_at, updated_at) VALUES (1, 1, 1, 'month_price', 'CI-TRADE-1', 1000, UNIX_TIMESTAMP(), UNIX_TIMESTAMP());"
          N=$($MYSQL irboard -N -e "SELECT (SELECT COUNT(*) FROM v2_user)+(SELECT COUNT(*) FROM v2_plan)+(SELECT COUNT(*) FROM v2_order);")
          test "$N" -eq 3
          echo "✓ Inserted user + plan + order and read them back — schema is functional."

      - name: install.sql is safe to re-run (idempotent DROP+CREATE)
        run: |
          set -e
          $MYSQL irboard < database/install.sql
          CNT=$($MYSQL irboard -N -e "SELECT COUNT(*) FROM v2_user;")
          test "$CNT" -eq 0
          echo "✓ Re-import succeeded and reset the schema cleanly."

      - name: update.sql builds the full schema (idempotent upgrade path)
        run: |
          set -e
          # update.sql uses CREATE TABLE IF NOT EXISTS + ADD COLUMN, and is applied by
          # the V2boardUpdate command which runs each statement and SWALLOWS errors
          # (an ADD COLUMN for a column that already exists on the full schema is a
          # no-op there). Emulate that error-tolerant apply with `mysql --force`.
          $MYSQL -e "DROP DATABASE IF EXISTS irboard_upgrade; CREATE DATABASE irboard_upgrade;"
          $MYSQL --force irboard_upgrade < database/update.sql 2>/dev/null || true
          CNT=$($MYSQL irboard_upgrade -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard_upgrade';")
          echo "✓ update.sql produced $CNT tables on a fresh database."
          test "$CNT" -ge 47
          # Re-apply on the SAME db: CREATE IF NOT EXISTS makes the table set stable.
          $MYSQL --force irboard_upgrade < database/update.sql 2>/dev/null || true
          CNT2=$($MYSQL irboard_upgrade -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='irboard_upgrade';")
          test "$CNT2" -eq "$CNT"
          echo "✓ Re-apply kept the schema stable ($CNT2 tables) — idempotent."

      - name: Migrating an upstream v2board (wyx2685) install leaves nothing missing
        run: |
          set -e
          # Irboard is a fork of wyx2685/v2board, so users migrate from it with an
          # existing database. Recreate a real upstream install, apply our upgrade
          # path exactly as V2boardUpdate does (error-tolerant), and assert the
          # result has every table/column a fresh install.sql produces. This is what
          # catches a forgotten ADD COLUMN — CREATE TABLE IF NOT EXISTS silently
          # leaves an existing table's columns untouched.
          curl -sfL https://raw.githubusercontent.com/wyx2685/v2board/master/database/install.sql -o upstream.sql
          echo "upstream tables: $(grep -ciE 'CREATE TABLE' upstream.sql)"
          $MYSQL -e "DROP DATABASE IF EXISTS irboard_migrate; CREATE DATABASE irboard_migrate;"
          $MYSQL irboard_migrate < upstream.sql
          $MYSQL --force irboard_migrate < database/update.sql 2>/dev/null || true
          MISSING=$($MYSQL -N -e "
            SELECT CONCAT(table_name,'.',column_name) FROM information_schema.columns WHERE table_schema='irboard'
            EXCEPT
            SELECT CONCAT(table_name,'.',column_name) FROM information_schema.columns WHERE table_schema='irboard_migrate';")
          if [ -n "$MISSING" ]; then
            echo "::error::update.sql does not migrate an upstream install completely. Missing: $(echo $MISSING | tr '\n' ' ' | head -c 400)"
            exit 1
          fi
          echo "✓ Upstream v2board migrates cleanly — every table and column present."
