[PHP]

engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1

disable_functions=header,header_remove,headers_sent,headers_list,http_response_code,setcookie,session_create_id,session_id,session_name,session_save_path,session_status,session_start,session_write_close,session_regenerate_id,session_unset, session_get_cookie_params,session_set_cookie_params,set_time_limit
zend.enable_gc = On
expose_php = On
max_execution_time = 30
max_input_time = 60
memory_limit = 512M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
html_errors = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 8M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
doc_root =
user_dir =
enable_dl = Off
cgi.fix_pathinfo=1
file_uploads = On
upload_max_filesize = 10M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
extension=igbinary.so
extension=redis.so

; OPcache + JIT.
; `php -c cli-php.ini` ignores the default php.ini, so the module must be loaded
; here too — without this line every opcache.* setting below is silently ignored
; and webman runs fully interpreted (no opcache, no JIT). Given as a bare name so
; it resolves through extension_dir and stays portable across hosts.
zend_extension=opcache.so
opcache.enable=1
opcache.enable_cli=1
; Must stay 1: webman workers are long-running, so with 0 they keep serving stale
; bytecode after an update until someone does a full restart.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; Keep doc-comments so annotation/reflection-based code keeps working.
opcache.save_comments=1
opcache.enable_file_override=1
opcache.huge_code_pages=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

opcache.jit_buffer_size = 128M
opcache.jit = tracing

[curl]
curl.cainfo = /etc/ssl/certs/ca-certificates.crt

[openssl]
openssl.cafile=/etc/ssl/certs/ca-certificates.crt